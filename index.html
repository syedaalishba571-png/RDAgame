async function getAIFeedback(scenario, selectedFoods, nutrients, targets) {
  const foodNames = selectedFoods.map(f => FOODS[f]?.label || f).join(", ");
  const deficits = Object.entries(nutrients).filter(([k,v])=>v<targets[k]*0.8).map(([k])=>RDA_META[k].label);
  const adequate = Object.entries(nutrients).filter(([k,v])=>v>=targets[k]*0.8).map(([k])=>RDA_META[k].label);
  const junkFoods = selectedFoods.filter(f=>FOODS[f]?.category==="Junk Food").map(f=>FOODS[f].label);
  const prompt = `You are a warm, encouraging AI nutrition assistant in a health education game.
Patient: ${scenario.name} | ${scenario.tags.join(", ")}
Clinical note: ${scenario.clinicalNote}
Chosen diet: ${foodNames||"nothing"}.
${junkFoods.length>0?`Junk/harmful foods selected: ${junkFoods.join(", ")}.`:""}
Deficient nutrients (below 80% RDA): ${deficits.join(", ")||"none"}.
Adequate nutrients: ${adequate.join(", ")||"none"}.

Give SHORT (3-4 sentences) warm educational feedback specific to this patient's clinical condition. 
Mention 1-2 specific deficiencies relevant to their diagnosis. Suggest 1-2 specific foods to add or swap.
${junkFoods.length>0?"Also briefly note why the junk food(s) are harmful for this specific patient.":""}
Be encouraging and educational. Concise and actionable.`;
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:250, messages:[{role:"user",content:prompt}] }),
    });
    const data = await response.json();
    return data.content?.[0]?.text || "Great effort! Review the nutrient bars to improve.";
  } catch { return "Great effort! Keep refining the diet based on the RDA meters."; }
}

function NutrientBar({ id, value, target }) {
  const meta = RDA_META[id];
  const pct = Math.min((value/target)*100, 100);
  const barColor = pct>=85 ? meta.color : pct>=50 ? P.lemon : P.rose;
  const icon = pct>=85 ? "✅" : pct>=50 ? "⚡" : "❌";
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{fontSize:12,color:P.text,fontWeight:700,display:"flex",gap:5,alignItems:"center"}}>
          <span>{meta.emoji}</span>{meta.label}
        </span>
        <span style={{fontSize:11,color:P.muted}}>{icon} {Math.round(value)}/{target} {meta.unit}</span>
      </div>
      <div style={{background:P.border,borderRadius:20,height:12,overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",borderRadius:20,background:`linear-gradient(90deg,${barColor}99,${barColor})`,transition:"width 0.7s cubic-bezier(.4,0,.2,1)",boxShadow:pct>=85?`0 0 10px ${meta.color}`:"none"}}/>
      </div>
    </div>
  );
}

function ScoreRing({ score, size=72 }) {
  const grade = score>=90?["S","#a8edca","#2ecc71"]:score>=75?["A","#bde4f7","#3498db"]:score>=55?["B","#ddd4f7","#9b59b6"]:score>=35?["C","#fef3a0","#f39c12"]:["D","#fbc8d4","#e74c3c"];
  const r=28, circ=2*Math.PI*r, dash=circ*(score/100);
  const fs = size>60?16:size>40?12:9;
  const fsSub = size>60?10:size>40?8:7;
  return (
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r*(size/72)} fill="none" stroke={P.border} strokeWidth={5}/>
        <circle cx={size/2} cy={size/2} r={r*(size/72)} fill="none" stroke={grade[1]} strokeWidth={5}
          strokeDasharray={`${dash*(size/72)} ${circ*(size/72)}`} strokeLinecap="round"
          style={{transition:"stroke-dasharray 0.8s ease",filter:`drop-shadow(0 0 5px ${grade[1]})`}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontWeight:900,fontSize:fs,color:grade[2],lineHeight:1}}>{grade[0]}</span>
        <span style={{fontSize:fsSub,color:P.muted}}>{score}%</span>
      </div>
    </div>
  );
}

function Sparkline({ scores, color="#b8f0e0" }) {
  if(!scores||scores.length<2) return null;
  const h=24,w=80;
  const pts = scores.map((s,i)=>`${(i/(scores.length-1))*w},${h-(s/100)*h}`).join(" ");
  return (
    <svg width={w} height={h} style={{overflow:"visible"}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>
      {scores.map((s,i)=><circle key={i} cx={(i/(scores.length-1))*w} cy={h-(s/100)*h} r={3} fill={color}/>)}
    </svg>
  );
}

function BlobBg() {
  const blobs=[

  ];
  return (
    <div style={{position:"fixed",inset:0,zIndex:0,overflow:"hidden",pointerEvents:"none"}}>
      {blobs.map((b,i)=>(
        <div key={i} style={{position:"absolute",left:b.x,top:b.y,width:b.s,height:b.s,borderRadius:"50%",background:b.c,filter:"blur(55px)",animation:`blob${i%3} ${6+i*1.5}s ease-in-out infinite alternate`}}/>

  const [animIn,setAnimIn]             = useState(false);
  const [detailFood,setDetailFood]     = useState(null);
  const [filterCategory,setFilterCategory] = useState("All");
  const timerRef = useRef(null);

  const scenario = SCENARIOS[scenarioIdx];
  const targets  = RDA_TARGETS[scenario.profile];

  const nutrients = Object.keys(RDA_META).reduce((acc,k)=>{
    acc[k] = selected.reduce((s,f)=>s+(FOODS[f]?.[k]||0),0); return acc;
  },{});

  const macros = selected.reduce((acc,f)=>{
    const fd = FOODS[f]||{};
    acc.calories += fd.calories||0;
    acc.protein  += fd.protein||0;
    acc.carbs    += fd.carbs||0;
    acc.fat      += fd.fat||0;
    acc.fiber    += fd.fiber||0;
    return acc;
  },{calories:0,protein:0,carbs:0,fat:0,fiber:0});

  const computeScore = (nutr,tgts) => {
    const vals = Object.keys(tgts).map(k=>Math.min((nutr[k]/tgts[k])*100,100));
    return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  };

  const avgScore = (e) => e.scores.length ? Math.round(e.scores.reduce((a,b)=>a+b,0)/e.scores.length) : 0;

  useEffect(()=>{setAnimIn(false);setTimeout(()=>setAnimIn(true),60);},[screen,scenarioIdx]);

  useEffect(()=>{
    if(mode==="timeattack"&&screen==="game"&&!submitted){
      setTimeLeft(60);
      timerRef.current=setInterval(()=>{
        setTimeLeft(t=>{
          if(t<=1){clearInterval(timerRef.current);handleSubmit(true);return 0;}
          return t-1;
        });
      },1000);
    }
    return()=>clearInterval(timerRef.current);
  },[screen,scenarioIdx]);

  const toggleFood = (food) => {
    if(submitted)return;
    setSelected(prev=>prev.includes(food)?prev.filter(f=>f!==food):prev.length<6?[...prev,food]:prev);
  };

  const handleSubmit = async () => {
    clearInterval(timerRef.current);
    const sc=computeScore(nutrients,targets);
    setRoundScore(sc); setRoundScores(prev=>[...prev,sc]);
    setSubmitted(true); setAILoading(true);
    const fb = await getAIFeedback(scenario,selected,nutrients,targets);
    setAIFeedback(fb); setAILoading(false);
  };

  const nextScenario = () => {
    if(scenarioIdx<SCENARIOS.length-1){

      setAIFeedback(""); setShowHint(false); setTab("nutrients"); setFilterCategory("All");

                    {isYou&&<span style={{fontSize:10,background:P.mint,color:P.deep,borderRadius:20,padding:"2px 8px",fontWeight:700}}>YOU</span>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginTop:5,flexWrap:"wrap"}}>
                    <Sparkline scores={entry.scores} color={i===0?"#f39c12":i===1?"#95a5a6":P.coral}/>
                    <span style={{fontSize:11,color:P.muted}}>{entry.date}</span>
                  </div>
                </div>
                <ScoreRing score={avg} size={58}/>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── HISTORY ─────────────────────────────────────────────────────────────────
  if(screen==="history") return (
    <div style={{minHeight:"100vh",background:P.bg,padding:"24px 16px",position:"relative"}}>
      <BlobBg/>
      <div style={{position:"relative",zIndex:1,maxWidth:580,margin:"0 auto",...fadeIn}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
          <button onClick={()=>setScreen("menu")} style={btn({background:P.surface,border:`1.5px solid ${P.border}`,color:P.muted,fontSize:13,padding:"8px 16px",borderRadius:12})}>← Back</button>
          <h1 style={{fontWeight:900,color:P.text,fontSize:28,margin:0}}>📋 My History</h1>
        </div>
        {playerHistory.length===0?(
          <div style={{...cardStyle,textAlign:"center",padding:52}}>
            <div style={{fontSize:52,marginBottom:12}}>🌱</div>
            <p style={{color:P.muted,fontSize:15}}>No games played yet!</p>
            <button className="hov" onClick={()=>setScreen("menu")} style={btn({background:`linear-gradient(135deg,${P.mint},${P.sky})`,color:P.deep,fontSize:14,padding:"12px 28px",marginTop:16})}>Play Now</button>
          </div>
        ):playerHistory.map((entry,i)=>{
          const avg=avgScore(entry);
          return (
            <div key={i} style={{...cardStyle,marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div>
                  <div style={{fontWeight:900,color:P.text,fontSize:18}}>{entry.avatar} {entry.name}</div>
                  <div style={{fontSize:12,color:P.muted,marginTop:2}}>{entry.date} · {entry.scores.length} scenarios</div>
                  <div style={{marginTop:8}}><Sparkline scores={entry.scores} color={P.coral}/></div>
                </div>
                <ScoreRing score={avg} size={72}/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
                {SCENARIOS.map((sc,j)=>{
                  const sc_score=entry.scores[j];
                  const color=sc_score>=75?P.mint:sc_score>=50?P.lemon:P.rose;
                  return (
                    <div key={j} style={{background:sc_score!=null?`${color}55`:P.surface,borderRadius:12,padding:"10px 12px",border:`1.5px solid ${sc_score!=null?color:P.border}`}}>
                      <div style={{fontSize:20,marginBottom:3}}>{sc.avatar}</div>
                      <div style={{fontSize:11,fontWeight:800,color:P.text}}>{sc.name}</div>
                      <div style={{fontSize:12,color:P.muted,marginTop:3}}>
                        {sc_score!=null?<strong style={{color:sc_score>=75?"#27ae60":sc_score>=50?"#f39c12":"#e74c3c"}}>{sc_score}%</strong>:<span>—</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // ── RESULTS ─────────────────────────────────────────────────────────────────
  if(screen==="results") {
    const avg=Math.round(roundScores.reduce((a,b)=>a+b,0)/roundScores.length);
    const grade=avg>=90?"Nutrition Master 🏆":avg>=75?"Health Expert 🥇":avg>=55?"Good Dietitian 🥈":avg>=35?"Keep Learning 📚":"Try Again 💪";
    return (
      <div style={{minHeight:"100vh",background:P.bg,padding:"24px 16px",position:"relative"}}>
        <BlobBg/>
        <div style={{position:"relative",zIndex:1,maxWidth:520,margin:"0 auto",...fadeIn}}>
          <div style={{...cardStyle,textAlign:"center",marginBottom:14,background:`linear-gradient(145deg,${P.mint}33,${P.sky}33)`}}>
            <div style={{fontSize:68,marginBottom:6}}>🎉</div>
            <h1 style={{fontWeight:900,color:P.text,fontSize:34,margin:0}}>Game Complete!</h1>
            <p style={{color:P.coral,fontSize:20,fontWeight:800,margin:"8px 0 0"}}>{grade}</p>
            <div style={{display:"flex",justifyContent:"center",margin:"20px 0"}}><ScoreRing score={avg} size={110}/></div>
            <p style={{color:P.muted,fontSize:13}}>Average across {SCENARIOS.length} clinical cases</p>
          </div>
          <div style={{...cardStyle,marginBottom:14}}>
            <h3 style={{fontWeight:900,color:P.text,margin:"0 0 14px",fontSize:16}}>📊 Round Breakdown</h3>
            {SCENARIOS.map((sc,i)=>{
              const s=roundScores[i]||0;
              const bg=s>=75?P.mint:s>=50?P.lemon:P.rose;
              return (
                <div key={i} style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,padding:"10px 14px",borderRadius:14,background:`${bg}33`,border:`1.5px solid ${bg}`}}>
                  <span style={{fontSize:26}}>{sc.avatar}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800,color:P.text,fontSize:14}}>{sc.name}</div>
                    <div style={{background:P.border,borderRadius:20,height:8,marginTop:5}}>
                      <div style={{width:`${s}%`,height:"100%",borderRadius:20,background:`linear-gradient(90deg,${bg}99,${bg})`,transition:"width 1.2s ease"}}/>
                    </div>
                  </div>
                  <ScoreRing score={s} size={44}/>
                </div>
              );
            })}
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <button className="hov" onClick={()=>setScreen("leaderboard")} style={btn({flex:1,background:`linear-gradient(135deg,${P.lemon},${P.peach})`,color:P.deep,fontSize:14,padding:"13px"})}>🏆 Leaderboard</button>
            <button className="hov" onClick={()=>setScreen("history")} style={btn({flex:1,background:`linear-gradient(135deg,${P.lavender},${P.blush})`,color:P.deep,fontSize:14,padding:"13px"})}>📋 My History</button>
            <button className="hov" onClick={restart} style={btn({width:"100%",background:`linear-gradient(135deg,${P.peach},${P.coral})`,color:"white",fontSize:15,padding:"14px",marginTop:2})}>🔄 Play Again</button>
          </div>
        </div>
      </div>
    );
  }

  // ── GAME ────────────────────────────────────────────────────────────────────
  const categories = ["All", ...new Set(scenario.availableFoods.map(f=>FOODS[f]?.category||"Other"))];
  const filteredFoods = scenario.availableFoods.filter(f=>filterCategory==="All"||(FOODS[f]?.category===filterCategory));

  return (
    <div style={{minHeight:"100vh",background:P.bg,paddingBottom:40,position:"relative"}}>
      <BlobBg/>

      {/* Detail panel overlay */}
      {detailFood && (
        <>
          <div onClick={()=>setDetailFood(null)} style={{position:"fixed",inset:0,zIndex:99,background:"#00000030",backdropFilter:"blur(2px)"}}/>
          <FoodDetailPanel foodKey={detailFood} onClose={()=>setDetailFood(null)}/>
        </>
      )}

      {/* Sticky top bar */}
      <div style={{background:P.card,borderBottom:`1.5px solid ${P.border}`,padding:"10px 18px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:20,backdropFilter:"blur(8px)"}}>
        <button onClick={restart} style={btn({background:P.surface,border:`1.5px solid ${P.border}`,color:P.muted,fontSize:12,padding:"6px 14px",borderRadius:10})}>← Menu</button>
        <div style={{flex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:P.muted,marginBottom:4}}>
            <span style={{fontWeight:700}}>{playerAvatar} {playerName||"Player"} · Patient {scenarioIdx+1}/{SCENARIOS.length}</span>
            <span style={{color:mode==="timeattack"&&timeLeft<=10?"#e74c3c":P.muted,fontWeight:700}}>
              {mode==="timeattack"?`⏳ ${timeLeft}s`:mode==="beginner"?"🌱 Beginner":"🤖 Challenge"}
            </span>
          </div>
          <div style={{background:P.border,borderRadius:20,height:7}}>
            <div style={{width:`${(scenarioIdx/SCENARIOS.length)*100}%`,height:"100%",background:`linear-gradient(90deg,${P.mint},${P.sky})`,borderRadius:20,transition:"width 0.5s"}}/>
          </div>
        </div>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          {roundScores.map((s,i)=><ScoreRing key={i} score={s} size={34}/>)}
        </div>
      </div>

      <div style={{maxWidth:960,margin:"0 auto",padding:"18px 16px",display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,position:"relative",zIndex:1,...fadeIn}}>

        {/* LEFT: Profile + Food */}
        <div>
          {/* Patient Card */}
          <div style={{...cardStyle,marginBottom:12}}>
            <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
              <div style={{fontSize:46,background:`linear-gradient(135deg,${P.peach},${P.rose})`,borderRadius:18,padding:"8px 12px",lineHeight:1,flexShrink:0}}>{scenario.avatar}</div>
              <div style={{flex:1}}>
                <h2 style={{margin:0,fontWeight:900,color:P.text,fontSize:20}}>{scenario.name}</h2>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
                  {scenario.tags.map(t=><span key={t} style={{fontSize:10,background:P.lemon,color:P.deep,borderRadius:20,padding:"3px 9px",fontWeight:700}}>{t}</span>)}
                </div>
                <p style={{color:P.muted,fontSize:12,margin:"7px 0 0",lineHeight:1.65}}>{scenario.bio}</p>
              </div>
            </div>
            {/* Clinical Note */}
            <div style={{marginTop:10,background:`${P.sky}44`,borderRadius:12,padding:"8px 12px",border:`1px solid ${P.sky}`,fontSize:12,color:P.deep}}>
              🩺 <strong>Clinical:</strong> {scenario.clinicalNote}
            </div>
            {mode==="beginner"&&(
              <div style={{marginTop:10,borderTop:`1px solid ${P.border}`,paddingTop:10}}>
                <button className="hov" onClick={()=>setShowHint(!showHint)} style={btn({background:P.lemon,color:P.deep,fontSize:12,padding:"5px 14px",borderRadius:20})}>
                  {showHint?"🙈 Hide Hint":"💡 Show Hint"}
                </button>
                {showHint&&<p style={{color:"#7d5a00",fontSize:13,margin:"8px 0 0",background:`${P.lemon}88`,borderRadius:10,padding:"8px 12px"}}>💡 {scenario.hint}</p>}
              </div>
            )}
          </div>

          {/* Food Selector */}
          <div style={cardStyle}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <h3 style={{margin:0,fontWeight:900,color:P.text,fontSize:15}}>🍽️ Build the Diet</h3>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,color:P.muted,fontStyle:"italic"}}>ℹ️ tap name for details</span>
                <span style={{fontSize:12,color:selected.length===6?"#e74c3c":P.muted,fontWeight:700,background:selected.length===6?`${P.rose}88`:P.surface,borderRadius:20,padding:"3px 10px"}}>{selected.length}/6</span>
              </div>
            </div>

            {/* Category filter */}
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
              {categories.map(cat=>(
                <button key={cat} onClick={()=>setFilterCategory(cat)} style={{fontSize:10,padding:"3px 10px",borderRadius:20,border:`1.5px solid ${filterCategory===cat?P.coral:P.border}`,background:filterCategory===cat?`${P.peach}66`:P.surface,color:filterCategory===cat?P.deep:P.muted,cursor:"pointer",fontWeight:700,fontFamily:"Nunito,sans-serif"}}>
                  {cat}
                </button>
              ))}
            </div>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,maxHeight:320,overflowY:"auto"}}>
              {filteredFoods.map(food=>{
                const isSel=selected.includes(food);
                const fd = FOODS[food];
                const isJunk = fd?.category==="Junk Food";
                return (
                  <div key={food} style={{position:"relative"}}>
                    <button className="foodbtn" onClick={()=>toggleFood(food)} style={{
                      width:"100%",padding:"8px 10px",borderRadius:12,textAlign:"left",fontSize:11,fontWeight:isSel?800:600,
                      border:`1.5px solid ${isSel?P.coral:isJunk?"#e74c3c44":P.border}`,
                      background:isSel?`${P.peach}55`:isJunk?`${P.rose}22`:P.surface,
                      color:isSel?P.deep:P.muted,cursor:(!isSel&&selected.length>=6)?"not-allowed":"pointer",
                      opacity:(!isSel&&selected.length>=6)?0.4:1,
                    }}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <span style={{lineHeight:1.4}}>{fd?.label||food}</span>
                        {isSel&&<span style={{color:P.coral,flexShrink:0,marginLeft:4}}>✓</span>}
                      </div>
                      <div style={{marginTop:3,fontSize:10,color:isJunk?"#e74c3c":P.muted,opacity:0.85}}>
                        {fd ? `${fd.calories}kcal · P:${fd.protein}g` : ""}
                        {isJunk && " ⚠️"}
                      </div>
                    </button>
                    {/* Info button */}
                    <button onClick={(e)=>{e.stopPropagation();setDetailFood(food);}} style={{position:"absolute",top:4,right:isSel?22:4,width:16,height:16,borderRadius:"50%",background:P.border,border:"none",fontSize:9,cursor:"pointer",color:P.muted,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Nunito,sans-serif"}}>i</button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* RIGHT: Tabs */}
        <div>
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            {[{id:"nutrients",label:"📊 Nutrients"},{id:"macros",label:"🔢 Macros"},{id:"foods",label:"🥗 My Plate"},{id:"ai",label:"🤖 AI Advice"}].map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                flex:1,padding:"8px 4px",borderRadius:12,border:`1.5px solid ${tab===t.id?P.coral:P.border}`,
                background:tab===t.id?`${P.rose}44`:P.card,
                color:tab===t.id?P.deep:P.muted,fontWeight:700,fontSize:11,cursor:"pointer",transition:"all 0.15s",
              }}>{t.label}</button>
            ))}
          </div>

          {tab==="nutrients"&&(
            <div style={cardStyle}>
              <h3 style={{margin:"0 0 14px",fontWeight:900,color:P.text,fontSize:15}}>📊 RDA Meter</h3>
              {Object.keys(RDA_META).map(k=><NutrientBar key={k} id={k} value={nutrients[k]} target={targets[k]}/>)}
              <div style={{marginTop:12,background:P.surface,borderRadius:12,padding:"9px 14px",border:`1px solid ${P.border}`,display:"flex",justifyContent:"space-between",fontSize:11,color:P.muted}}>
                <span>❌ &lt;50%</span><span>⚡ 50–84%</span><span>✅ ≥85%</span>
              </div>
            </div>
          )}

          {tab==="macros"&&(
            <div style={cardStyle}>
              <h3 style={{margin:"0 0 14px",fontWeight:900,color:P.text,fontSize:15}}>🔢 Macronutrients</h3>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
                {[
                  {label:"Calories",val:Math.round(macros.calories),unit:"kcal",color:P.coral,ref:"~2000",emoji:"🔥"},
                  {label:"Protein",val:Math.round(macros.protein),unit:"g",color:"#ddd4f7",ref:`RDA: ${targets.protein}g`,emoji:"💪"},
                  {label:"Carbs",val:Math.round(macros.carbs),unit:"g",color:P.lemon,ref:"~250g",emoji:"🍞"},
                  {label:"Fat",val:Math.round(macros.fat),unit:"g",color:P.peach,ref:"~65g",emoji:"🥑"},
                  {label:"Fiber",val:Math.round(macros.fiber),unit:"g",color:P.sage,ref:"~25g",emoji:"🌿"},
                ].map(m=>(
                  <div key={m.label} style={{background:`${m.color}44`,borderRadius:14,padding:"10px 12px",border:`1.5px solid ${m.color}`}}>
                    <div style={{fontSize:18}}>{m.emoji}</div>
                    <div style={{fontWeight:900,color:P.text,fontSize:18,marginTop:2}}>{m.val}<span style={{fontSize:11,fontWeight:600}}>{m.unit}</span></div>
                    <div style={{fontSize:10,color:P.muted,fontWeight:700}}>{m.label}</div>
                    <div style={{fontSize:10,color:P.muted}}>{m.ref}</div>
                  </div>
                ))}
              </div>
              <div style={{background:`${P.sky}33`,borderRadius:12,padding:"10px 14px",fontSize:12,color:P.deep,border:`1px solid ${P.sky}`}}>
                💡 <strong>Protein check:</strong> {Math.round(macros.protein)}/{targets.protein}g — {macros.protein>=targets.protein?"✅ Target met!":"❌ Need "+(targets.protein-Math.round(macros.protein))+"g more"}
              </div>
            </div>
          )}

          {tab==="foods"&&(
            <div style={cardStyle}>
              <h3 style={{margin:"0 0 14px",fontWeight:900,color:P.text,fontSize:15}}>🥗 My Plate</h3>
              {selected.length===0?(
                <div style={{textAlign:"center",padding:"28px 0",color:P.muted,fontSize:13}}>
                  <div style={{fontSize:36,marginBottom:8}}>🍽️</div>
                  Select up to 6 foods from the left →
                </div>
              ):selected.map(f=>{
                const fd = FOODS[f];
                const isJunk = fd?.category==="Junk Food";
                return (
                  <div key={f} style={{padding:"9px 12px",borderRadius:12,background:isJunk?`${P.rose}33`:P.surface,border:`1px solid ${isJunk?"#e74c3c44":P.border}`,marginBottom:7}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:13,color:P.text,fontWeight:700}}>{fd?.label}</span>
                      <div style={{display:"flex",gap:6,alignItems:"center"}}>
                        <button onClick={()=>setDetailFood(f)} style={{background:P.surface,border:`1px solid ${P.border}`,color:P.muted,cursor:"pointer",fontSize:10,borderRadius:8,padding:"2px 7px",fontWeight:700,fontFamily:"Nunito"}}>info</button>
                        <button onClick={()=>toggleFood(f)} style={{background:`${P.rose}55`,border:`1px solid ${P.rose}`,color:P.coral,cursor:"pointer",fontSize:14,borderRadius:8,padding:"2px 8px",fontWeight:700}}>×</button>
                      </div>
                    </div>
                    <div style={{fontSize:11,color:P.muted,marginTop:3,display:"flex",gap:10}}>
                      <span>🔥 {fd?.calories}kcal</span>
                      <span>💪 {fd?.protein}g protein</span>
                      <span>🌿 {fd?.fiber}g fiber</span>
                      {isJunk&&<span style={{color:"#e74c3c",fontWeight:700}}>⚠️ junk</span>}
                    </div>
                  </div>
                );
              })}
              {submitted&&(
                <div style={{marginTop:14,textAlign:"center",padding:"14px 0",borderTop:`1px solid ${P.border}`}}>
                  <ScoreRing score={roundScore} size={80}/>
                  <p style={{fontSize:13,color:P.muted,marginTop:6}}>Round Score</p>
                </div>
              )}
            </div>
          )}

          {tab==="ai"&&(
            <div style={cardStyle}>
              <h3 style={{margin:"0 0 12px",fontWeight:900,color:P.text,fontSize:15}}>🤖 AI Nutritionist</h3>
              {!submitted?(
                <p style={{color:P.muted,fontSize:13,lineHeight:1.7,fontStyle:"italic"}}>
                  Build a diet and submit to get personalised AI feedback for {scenario.name}!
                </p>
              ):aiLoading?(
                <div style={{display:"flex",alignItems:"center",gap:10,color:P.deep,fontSize:13,padding:"8px 0"}}>
                  <div style={{width:22,height:22,border:`3px solid ${P.mint}`,borderTopColor:P.coral,borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}/>
                  Analysing your diet plan...
                </div>
              ):(
                <div style={{background:`${P.mint}44`,borderRadius:14,padding:"14px 16px",border:`1.5px solid ${P.mint}`}}>
                  <p style={{color:P.deep,fontSize:13,lineHeight:1.8,margin:0}}>{aiFeedback}</p>
                </div>
              )}
            </div>
          )}

          <div style={{marginTop:12}}>
            {!submitted?(
              <button className="hov" onClick={handleSubmit} disabled={selected.length===0} style={btn({
                width:"100%",padding:"14px",borderRadius:14,
                background:selected.length===0?P.border:`linear-gradient(135deg,${P.mint},${P.sky})`,
                color:selected.length===0?P.muted:P.deep,fontSize:16,
                cursor:selected.length===0?"not-allowed":"pointer",
                boxShadow:selected.length===0?"none":`0 4px 18px ${P.mint}88`,
              })}>Submit Diet ✓</button>
            ):(
              <button className="hov" onClick={nextScenario} style={btn({
                width:"100%",padding:"14px",borderRadius:14,
                background:`linear-gradient(135deg,${P.peach},${P.coral})`,
                color:"white",fontSize:16,boxShadow:`0 4px 18px ${P.coral}66`,
              })}>{scenarioIdx<SCENARIOS.length-1?"Next Patient →":"See Results 🏆"}</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<NutritionGame />);
</script>
</body>
</html>
